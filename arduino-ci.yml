name: Arduino CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v1

      - name: Install AVR core
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr

      - name: Compile step01_blink
        run: |
          arduino-cli compile --fqbn arduino:avr:uno code/step01_blink

      - name: Compile step02_button_led
        run: |
          arduino-cli compile --fqbn arduino:avr:uno code/step02_button_led
